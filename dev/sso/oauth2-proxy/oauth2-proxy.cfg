provider = "keycloak-oidc"
provider_display_name = "Query Doctor Dev Keycloak"

client_id = "query-doctor-dev"
redirect_url = "http://query-doctor-sso.localhost:4180/oauth2/callback"
oidc_issuer_url = "http://query-doctor-sso.localhost:18080/realms/query-doctor-dev"
skip_oidc_discovery = true
login_url = "http://query-doctor-sso.localhost:18080/realms/query-doctor-dev/protocol/openid-connect/auth"
redeem_url = "http://keycloak:8080/realms/query-doctor-dev/protocol/openid-connect/token"
oidc_jwks_url = "http://keycloak:8080/realms/query-doctor-dev/protocol/openid-connect/certs"
scope = "openid email profile"
code_challenge_method = "S256"
email_domains = [ "*" ]

http_address = "0.0.0.0:4180"
upstreams = [ "http://query-doctor:8765" ]

cookie_name = "_qdoc_dev_sso"
cookie_secure = false
cookie_httponly = true
cookie_samesite = "lax"
cookie_expire = "8h"

pass_user_headers = true
prefer_email_to_user = false
skip_auth_strip_headers = true
pass_access_token = false
pass_authorization_header = false
set_authorization_header = false
set_xauthrequest = false
pass_basic_auth = false
set_basic_auth = false

auth_logging = false
request_logging = false
show_debug_on_error = false
silence_ping_logging = true
skip_provider_button = true
