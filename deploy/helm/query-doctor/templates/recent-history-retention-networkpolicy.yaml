{{- $recentHistory := .Values.recentHistory | default dict -}}
{{- $recentHistoryPostgres := (get $recentHistory "postgres") | default dict -}}
{{- $recentHistoryPostgresEnabled := and (eq .Values.mode "configured") ((get $recentHistoryPostgres "enabled") | default false) -}}
{{- $retention := (get $recentHistoryPostgres "retention") | default dict -}}
{{- $retentionEnabled := and $recentHistoryPostgresEnabled ((get $retention "enabled") | default false) -}}
{{- if and .Values.networkPolicy.enabled $retentionEnabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-recent-history-retention-egress" (include "query-doctor.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "query-doctor.recentHistoryRetentionLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "query-doctor.recentHistoryRetentionSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  {{- if eq .Values.networkPolicy.egressMode "allowAll" }}
  egress:
    - {}
  {{- else if eq .Values.networkPolicy.egressMode "custom" }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
