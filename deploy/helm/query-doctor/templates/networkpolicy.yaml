{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-egress" (include "query-doctor.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "query-doctor.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "query-doctor.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  {{- if eq .Values.networkPolicy.egressMode "allowAll" }}
  egress:
    - {}
  {{- else if eq .Values.networkPolicy.egressMode "custom" }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
