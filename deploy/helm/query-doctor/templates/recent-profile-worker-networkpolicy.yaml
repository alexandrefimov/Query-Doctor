{{- $recentProfileWorker := .Values.recentProfileWorker | default dict -}}
{{- $recentProfileWorkerEnabled := and (eq .Values.mode "configured") ((get $recentProfileWorker "enabled") | default false) -}}
{{- if and .Values.networkPolicy.enabled $recentProfileWorkerEnabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-recent-profile-worker-egress" (include "query-doctor.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "query-doctor.recentProfileWorkerLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "query-doctor.recentProfileWorkerSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  {{- if eq .Values.networkPolicy.egressMode "allowAll" }}
  egress:
    - {}
  {{- else if eq .Values.networkPolicy.egressMode "custom" }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
  {{- else }}
  egress: []
  {{- end }}
{{- end }}
