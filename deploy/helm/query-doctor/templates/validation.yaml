{{- $kerberos := .Values.kerberos | default dict -}}
{{- $kerberosEnabled := (get $kerberos "enabled") | default false -}}
{{- $kerberosExistingSecret := (get $kerberos "existingSecret") | default "" -}}
{{- $kerberosPrincipalKey := (get $kerberos "principalKey") | default "principal" -}}
{{- $kerberosKeytabKey := (get $kerberos "keytabKey") | default "query-doctor.keytab" -}}
{{- $kerberosCachePath := (get $kerberos "cachePath") | default "/tmp/query-doctor-krb5/krb5cc_query_doctor" -}}
{{- $kerberosRenewer := (get $kerberos "renewer") | default dict -}}
{{- $kerberosRenewerEnabled := dig "enabled" true $kerberosRenewer -}}
{{- $kerberosRefreshIntervalSeconds := dig "refreshIntervalSeconds" 1800 $kerberosRenewer -}}
{{- $recentHistory := .Values.recentHistory | default dict -}}
{{- $recentHistoryPostgres := (get $recentHistory "postgres") | default dict -}}
{{- $recentHistoryPostgresEnabled := (get $recentHistoryPostgres "enabled") | default false -}}
{{- $recentHistoryPostgresExistingSecret := (get $recentHistoryPostgres "existingSecret") | default "" -}}
{{- $recentHistoryPostgresDsnKey := (get $recentHistoryPostgres "dsnKey") | default "dsn" -}}
{{- $recentHistoryPostgresDsnEnvName := (get $recentHistoryPostgres "dsnEnvName") | default "QUERY_DOCTOR_RECENT_HISTORY_POSTGRES_DSN" -}}
{{- $recentHistoryPostgresCnpg := (get $recentHistoryPostgres "cnpg") | default dict -}}
{{- $recentHistoryPostgresCnpgEnabled := (get $recentHistoryPostgresCnpg "enabled") | default false -}}
{{- $recentHistoryPostgresCnpgInstances := (get $recentHistoryPostgresCnpg "instances") | default 1 -}}
{{- $recentHistoryPostgresCnpgDatabase := (get $recentHistoryPostgresCnpg "database") | default "query_doctor" -}}
{{- $recentHistoryPostgresCnpgOwner := (get $recentHistoryPostgresCnpg "owner") | default "query_doctor" -}}
