{{- $kerberos := .Values.kerberos | default dict -}}
{{- $kerberosEnabled := and (eq .Values.mode "configured") ((get $kerberos "enabled") | default false) -}}
{{- $kerberosSecret := (get $kerberos "existingSecret") | default "" -}}
{{- $kerberosPrincipalKey := (get $kerberos "principalKey") | default "principal" -}}
{{- $kerberosKeytabKey := (get $kerberos "keytabKey") | default "query-doctor.keytab" -}}
{{- $kerberosKrb5ConfKey := (get $kerberos "krb5ConfKey") | default "krb5.conf" -}}
{{- $kerberosCachePath := (get $kerberos "cachePath") | default "/tmp/query-doctor-krb5/krb5cc_query_doctor" -}}
{{- $kerberosRenewer := (get $kerberos "renewer") | default dict -}}
{{- $kerberosRenewerEnabled := and $kerberosEnabled (dig "enabled" true $kerberosRenewer) -}}
{{- $kerberosRefreshIntervalSeconds := dig "refreshIntervalSeconds" 1800 $kerberosRenewer -}}
{{- $kerberosRenewerResources := (get $kerberosRenewer "resources") | default .Values.resources -}}
{{- $recentHistory := .Values.recentHistory | default dict -}}
{{- $recentHistoryPostgres := (get $recentHistory "postgres") | default dict -}}
{{- $recentHistoryPostgresEnabled := and (eq .Values.mode "configured") ((get $recentHistoryPostgres "enabled") | default false) -}}
{{- $recentHistoryPostgresSecret := (get $recentHistoryPostgres "existingSecret") | default "" -}}
{{- $recentHistoryPostgresDsnKey := (get $recentHistoryPostgres "dsnKey") | default "dsn" -}}
{{- $recentHistoryPostgresDsnEnvName := (get $recentHistoryPostgres "dsnEnvName") | default "QUERY_DOCTOR_RECENT_HISTORY_POSTGRES_DSN" -}}
{{- $recentHistoryPostgresReadiness := (get $recentHistoryPostgres "readiness") | default dict -}}
{{- $recentHistoryPostgresReadinessEnabled := and $recentHistoryPostgresEnabled ((get $recentHistoryPostgresReadiness "enabled") | default true) -}}
{{- $recentHistoryPostgresReadinessResources := (get $recentHistoryPostgresReadiness "resources") | default .Values.resources -}}
{{- $operatorReadiness := (get $recentHistory "operatorReadiness") | default dict -}}
{{- $operatorReadinessEnabled := and (eq .Values.mode "configured") ((get $operatorReadiness "enabled") | default false) -}}
{{- $operatorReadinessSummaryDir := (get $operatorReadiness "summaryDir") | default "/var/lib/query-doctor/recent-history/operator-readiness" -}}
{{- $operatorReadinessPostgresSummary := (get $operatorReadiness "postgresReadinessSummaryJson") | default "/var/lib/query-doctor/recent-history/operator-readiness/postgres-readiness-summary.json" -}}
{{- $recentBatchMountPath := .Values.persistence.recentBatchMountPath | default "/tmp/query-doctor-web-batches" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "query-doctor.fullname" . | quote }}
  labels:
    {{- include "query-doctor.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      {{- include "query-doctor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "query-doctor.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
{{ toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "query-doctor.serviceAccountName" . | quote }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        {{- if eq .Values.mode "configured" }}
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        {{- end }}
      {{- if or $recentHistoryPostgresReadinessEnabled $kerberosEnabled }}
      initContainers:
        {{- if $recentHistoryPostgresReadinessEnabled }}
        - name: recent-history-postgres-readiness
          image: {{ include "query-doctor.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if $operatorReadinessEnabled }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              mkdir -p {{ $operatorReadinessSummaryDir | quote }}
              exec query-doctor-recent-history-postgres-readiness --json --fail-on-warning --postgres-dsn-env {{ $recentHistoryPostgresDsnEnvName | quote }} --summary-json {{ $operatorReadinessPostgresSummary | quote }}
          {{- else }}
          command:
            - query-doctor-recent-history-postgres-readiness
          args:
            - --json
            - --fail-on-warning
            - --postgres-dsn-env
            - {{ $recentHistoryPostgresDsnEnvName | quote }}
          {{- end }}
          env:
            - name: {{ $recentHistoryPostgresDsnEnvName | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ $recentHistoryPostgresSecret | quote }}
                  key: {{ $recentHistoryPostgresDsnKey | quote }}
          resources:
            {{- toYaml $recentHistoryPostgresReadinessResources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if $operatorReadinessEnabled }}
            - name: cases
              mountPath: {{ .Values.persistence.mountPath | quote }}
            {{- end }}
        {{- end }}
        {{- if $kerberosEnabled }}
        - name: kerberos-kinit
          image: {{ include "query-doctor.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              cache_file="${KRB5CCNAME#FILE:}"
              rm -f "$cache_file"
              principal="$(cat /etc/query-doctor-kerberos/{{ $kerberosPrincipalKey }})"
              kinit -kt /etc/query-doctor-kerberos/{{ $kerberosKeytabKey }} -c "$cache_file" "$principal"
              chmod 600 "$cache_file"
              klist -s -c "$cache_file"
          env:
            - name: KRB5CCNAME
              value: {{ printf "FILE:%s" $kerberosCachePath | quote }}
            {{- if $kerberosKrb5ConfKey }}
            - name: KRB5_CONFIG
              value: {{ printf "/etc/query-doctor-kerberos/%s" $kerberosKrb5ConfKey | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: kerberos-init-secret
              mountPath: /etc/query-doctor-kerberos
              readOnly: true
            - name: kerberos-cache
              mountPath: /tmp/query-doctor-krb5
        {{- end }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "query-doctor.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --host
            - {{ .Values.web.host | quote }}
            - --port
            - {{ .Values.web.port | quote }}
            {{- if .Values.web.allowNonlocalWebBind }}
            - --allow-nonlocal-web-bind
            {{- end }}
            {{- if eq .Values.mode "publicDemo" }}
            - --public-demo
            {{- else }}
            - --config
            - {{ printf "%s/%s" .Values.config.mountPath .Values.config.key | quote }}
            {{- if .Values.web.noLlm }}
            - --no-llm
            {{- end }}
            {{- end }}
            {{- with .Values.web.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or $kerberosEnabled $recentHistoryPostgresEnabled }}
          env:
            {{- if $kerberosEnabled }}
            - name: KRB5CCNAME
              value: {{ printf "FILE:%s" $kerberosCachePath | quote }}
            {{- if $kerberosKrb5ConfKey }}
            - name: KRB5_CONFIG
              value: {{ printf "/etc/query-doctor-kerberos-config/%s" $kerberosKrb5ConfKey | quote }}
            {{- end }}
            {{- end }}
            {{- if $recentHistoryPostgresEnabled }}
            - name: {{ $recentHistoryPostgresDsnEnvName | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ $recentHistoryPostgresSecret | quote }}
                  key: {{ $recentHistoryPostgresDsnKey | quote }}
            {{- end }}
          {{- end }}
          {{- if .Values.credentials.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.credentials.existingSecret | quote }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if eq .Values.mode "configured" }}
            - name: config
              mountPath: {{ .Values.config.mountPath | quote }}
              readOnly: true
            - name: cases
              mountPath: {{ .Values.persistence.mountPath | quote }}
            {{- if ne $recentBatchMountPath .Values.persistence.mountPath }}
            - name: cases
              mountPath: {{ $recentBatchMountPath | quote }}
            {{- end }}
            {{- if $kerberosEnabled }}
            - name: kerberos-cache
              mountPath: /tmp/query-doctor-krb5
            {{- if $kerberosKrb5ConfKey }}
            - name: kerberos-config
              mountPath: /etc/query-doctor-kerberos-config
              readOnly: true
            {{- end }}
            {{- end }}
            {{- end }}
        {{- if $kerberosRenewerEnabled }}
        - name: kerberos-ticket-renewer
          image: {{ include "query-doctor.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              cache_file="${KRB5CCNAME#FILE:}"
              principal="$(cat /etc/query-doctor-kerberos/{{ $kerberosPrincipalKey }})"
              while true; do
                sleep "$KERBEROS_REFRESH_INTERVAL_SECONDS"
                if kinit -kt /etc/query-doctor-kerberos/{{ $kerberosKeytabKey }} -c "$cache_file" "$principal" >/dev/null 2>&1 \
                  && chmod 600 "$cache_file" \
                  && klist -s -c "$cache_file" >/dev/null 2>&1; then
                  echo "Kerberos credential cache refreshed"
                else
                  echo "Kerberos credential cache refresh failed" >&2
                fi
              done
          env:
            - name: KRB5CCNAME
              value: {{ printf "FILE:%s" $kerberosCachePath | quote }}
            - name: KERBEROS_REFRESH_INTERVAL_SECONDS
              value: {{ $kerberosRefreshIntervalSeconds | quote }}
            {{- if $kerberosKrb5ConfKey }}
            - name: KRB5_CONFIG
              value: {{ printf "/etc/query-doctor-kerberos/%s" $kerberosKrb5ConfKey | quote }}
            {{- end }}
          resources:
            {{- toYaml $kerberosRenewerResources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: kerberos-init-secret
              mountPath: /etc/query-doctor-kerberos
              readOnly: true
            - name: kerberos-cache
              mountPath: /tmp/query-doctor-krb5
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if eq .Values.mode "configured" }}
        - name: config
          configMap:
            name: {{ include "query-doctor.configMapName" . | quote }}
        - name: cases
          persistentVolumeClaim:
            claimName: {{ include "query-doctor.claimName" . | quote }}
        {{- if $kerberosEnabled }}
        - name: kerberos-cache
          emptyDir: {}
        - name: kerberos-init-secret
          secret:
            secretName: {{ $kerberosSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ $kerberosPrincipalKey | quote }}
                path: {{ $kerberosPrincipalKey | quote }}
              - key: {{ $kerberosKeytabKey | quote }}
                path: {{ $kerberosKeytabKey | quote }}
              {{- if $kerberosKrb5ConfKey }}
              - key: {{ $kerberosKrb5ConfKey | quote }}
                path: {{ $kerberosKrb5ConfKey | quote }}
              {{- end }}
        {{- if $kerberosKrb5ConfKey }}
        - name: kerberos-config
          secret:
            secretName: {{ $kerberosSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ $kerberosKrb5ConfKey | quote }}
                path: {{ $kerberosKrb5ConfKey | quote }}
        {{- end }}
        {{- end }}
        {{- end }}
