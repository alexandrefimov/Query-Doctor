{{- if and .Values.selfTestJob.enabled .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-self-test-egress" (include "query-doctor.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "query-doctor.selfTestLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "query-doctor.selfTestSelectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress: []
{{- end }}
