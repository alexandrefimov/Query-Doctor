{{- $recentHistory := .Values.recentHistory | default dict -}}
{{- $recentHistoryPostgres := (get $recentHistory "postgres") | default dict -}}
{{- $recentHistoryPostgresEnabled := and (eq .Values.mode "configured") ((get $recentHistoryPostgres "enabled") | default false) -}}
{{- $profileRemediation := (get $recentHistoryPostgres "profileRemediation") | default dict -}}
{{- $profileRemediationEnabled := and $recentHistoryPostgresEnabled ((get $profileRemediation "enabled") | default false) -}}
{{- if $profileRemediationEnabled }}
{{- $recentHistoryPostgresSecret := (get $recentHistoryPostgres "existingSecret") | default "" -}}
{{- $recentHistoryPostgresDsnKey := (get $recentHistoryPostgres "dsnKey") | default "dsn" -}}
{{- $recentHistoryPostgresDsnEnvName := (get $recentHistoryPostgres "dsnEnvName") | default "QUERY_DOCTOR_RECENT_HISTORY_POSTGRES_DSN" -}}
{{- $operatorReadiness := (get $recentHistory "operatorReadiness") | default dict -}}
{{- $operatorReadinessSummaryDir := (get $operatorReadiness "summaryDir") | default "/var/lib/query-doctor/recent-history/operator-readiness" -}}
{{- $operatorReadinessRemediationSummary := (get $operatorReadiness "profileRemediationSummaryJson") | default "" -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-recent-profile-remediation" (include "query-doctor.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "query-doctor.recentProfileRemediationLabels" . | nindent 4 }}
  {{- with .Values.recentHistory.postgres.profileRemediation.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ .Values.recentHistory.postgres.profileRemediation.schedule | quote }}
  suspend: {{ .Values.recentHistory.postgres.profileRemediation.suspend }}
  concurrencyPolicy: {{ .Values.recentHistory.postgres.profileRemediation.concurrencyPolicy | quote }}
  startingDeadlineSeconds: {{ .Values.recentHistory.postgres.profileRemediation.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.recentHistory.postgres.profileRemediation.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.recentHistory.postgres.profileRemediation.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.recentHistory.postgres.profileRemediation.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.recentHistory.postgres.profileRemediation.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "query-doctor.recentProfileRemediationSelectorLabels" . | nindent 12 }}
          {{- with .Values.recentHistory.postgres.profileRemediation.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          serviceAccountName: {{ include "query-doctor.serviceAccountName" . | quote }}
          automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          initContainers:
            - name: operator-readiness-summary-dir
              image: {{ include "query-doctor.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /bin/sh
                - -ec
              args:
                - mkdir -p {{ $operatorReadinessSummaryDir | quote }}
              resources:
                {{- toYaml .Values.recentHistory.postgres.profileRemediation.resources | nindent 16 }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              volumeMounts:
                - name: cases
                  mountPath: {{ .Values.persistence.mountPath | quote }}
          containers:
            - name: recent-profile-remediation
              image: {{ include "query-doctor.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - query-doctor-recent-profile-remediation
              args:
                - --json
                - --fail-on-warning
                - --dry-run
                - --summary-json
                - {{ $operatorReadinessRemediationSummary | quote }}
                - --backend
                - postgres
                - --postgres-dsn-env
                - {{ $recentHistoryPostgresDsnEnvName | quote }}
                - --max-jobs
                - {{ .Values.recentHistory.postgres.profileRemediation.maxJobs | quote }}
                {{- with .Values.recentHistory.postgres.profileRemediation.engine }}
                - --engine
                - {{ . | quote }}
                {{- end }}
                {{- with .Values.recentHistory.postgres.profileRemediation.sourceKind }}
                - --source-kind
                - {{ . | quote }}
                {{- end }}
                {{- with .Values.recentHistory.postgres.profileRemediation.sourceKey }}
                - --source-key
                - {{ . | quote }}
                {{- end }}
              env:
                - name: {{ $recentHistoryPostgresDsnEnvName | quote }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ $recentHistoryPostgresSecret | quote }}
                      key: {{ $recentHistoryPostgresDsnKey | quote }}
              resources:
                {{- toYaml .Values.recentHistory.postgres.profileRemediation.resources | nindent 16 }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: cases
                  mountPath: {{ .Values.persistence.mountPath | quote }}
          volumes:
            - name: tmp
              emptyDir: {}
            - name: cases
              persistentVolumeClaim:
                claimName: {{ include "query-doctor.claimName" . | quote }}
{{- end }}
