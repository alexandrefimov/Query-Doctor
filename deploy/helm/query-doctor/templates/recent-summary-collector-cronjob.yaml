{{- $recentSummaryCollector := .Values.recentSummaryCollector | default dict -}}
{{- $recentSummaryCollectorEnabled := and (eq .Values.mode "configured") ((get $recentSummaryCollector "enabled") | default false) -}}
{{- if $recentSummaryCollectorEnabled }}
{{- $kerberos := .Values.kerberos | default dict -}}
{{- $kerberosEnabled := and (eq .Values.mode "configured") ((get $kerberos "enabled") | default false) -}}
{{- $kerberosSecret := (get $kerberos "existingSecret") | default "" -}}
{{- $kerberosPrincipalKey := (get $kerberos "principalKey") | default "principal" -}}
{{- $kerberosKeytabKey := (get $kerberos "keytabKey") | default "query-doctor.keytab" -}}
{{- $kerberosKrb5ConfKey := (get $kerberos "krb5ConfKey") | default "krb5.conf" -}}
{{- $kerberosCachePath := (get $kerberos "cachePath") | default "/tmp/query-doctor-krb5/krb5cc_query_doctor" -}}
{{- $recentHistory := .Values.recentHistory | default dict -}}
{{- $recentHistoryPostgres := (get $recentHistory "postgres") | default dict -}}
{{- $recentHistoryPostgresSecret := (get $recentHistoryPostgres "existingSecret") | default "" -}}
{{- $recentHistoryPostgresDsnKey := (get $recentHistoryPostgres "dsnKey") | default "dsn" -}}
{{- $recentHistoryPostgresDsnEnvName := (get $recentHistoryPostgres "dsnEnvName") | default "QUERY_DOCTOR_RECENT_HISTORY_POSTGRES_DSN" -}}
{{- $collectorOut := (get $recentSummaryCollector "out") | default "/tmp/query-doctor-recent-collector" -}}
{{- $collectorSummaryJson := (get $recentSummaryCollector "summaryJson") | default "/var/lib/query-doctor/recent-history/collector-summary.json" -}}
{{- $collectorProgressJsonl := (get $recentSummaryCollector "progressJsonl") | default "/var/lib/query-doctor/recent-history/collector-progress.jsonl" -}}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-recent-summary-collector" (include "query-doctor.fullname" .) | trunc 63 | trimSuffix "-" | quote }}
  labels:
    {{- include "query-doctor.recentSummaryCollectorLabels" . | nindent 4 }}
  {{- with .Values.recentSummaryCollector.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  schedule: {{ .Values.recentSummaryCollector.schedule | quote }}
  suspend: {{ .Values.recentSummaryCollector.suspend }}
  concurrencyPolicy: {{ .Values.recentSummaryCollector.concurrencyPolicy | quote }}
  startingDeadlineSeconds: {{ .Values.recentSummaryCollector.startingDeadlineSeconds }}
  successfulJobsHistoryLimit: {{ .Values.recentSummaryCollector.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.recentSummaryCollector.failedJobsHistoryLimit }}
  jobTemplate:
    spec:
      backoffLimit: {{ .Values.recentSummaryCollector.backoffLimit }}
      activeDeadlineSeconds: {{ .Values.recentSummaryCollector.activeDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "query-doctor.recentSummaryCollectorSelectorLabels" . | nindent 12 }}
          {{- with .Values.recentSummaryCollector.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          serviceAccountName: {{ include "query-doctor.serviceAccountName" . | quote }}
          automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
            fsGroup: 10001
            fsGroupChangePolicy: OnRootMismatch
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $kerberosEnabled }}
          initContainers:
            - name: kerberos-kinit
              image: {{ include "query-doctor.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /bin/sh
                - -ec
              args:
                - |
                  cache_file="${KRB5CCNAME#FILE:}"
                  rm -f "$cache_file"
                  principal="$(cat /etc/query-doctor-kerberos/{{ $kerberosPrincipalKey }})"
                  kinit -kt /etc/query-doctor-kerberos/{{ $kerberosKeytabKey }} -c "$cache_file" "$principal"
                  chmod 600 "$cache_file"
                  klist -s -c "$cache_file"
              env:
                - name: KRB5CCNAME
                  value: {{ printf "FILE:%s" $kerberosCachePath | quote }}
                {{- if $kerberosKrb5ConfKey }}
                - name: KRB5_CONFIG
                  value: {{ printf "/etc/query-doctor-kerberos/%s" $kerberosKrb5ConfKey | quote }}
                {{- end }}
              resources:
                {{- toYaml .Values.recentSummaryCollector.resources | nindent 16 }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              volumeMounts:
                - name: kerberos-init-secret
                  mountPath: /etc/query-doctor-kerberos
                  readOnly: true
                - name: kerberos-cache
                  mountPath: /tmp/query-doctor-krb5
          {{- end }}
          containers:
            - name: recent-summary-collector
              image: {{ include "query-doctor.image" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - query-doctor-batch-recent
              args:
                - --discover-only
                - --metadata-mode
                - "off"
                - --top-reports
                - "0"
                - --config
                - {{ printf "%s/%s" .Values.config.mountPath .Values.config.key | quote }}
                - --out
                - {{ $collectorOut | quote }}
                - --recent-history-backend
                - postgres
                - --recent-history-postgres-dsn-env
                - {{ $recentHistoryPostgresDsnEnvName | quote }}
                - --recent-history-collector-summary-json
                - {{ $collectorSummaryJson | quote }}
                - --progress-jsonl
                - {{ $collectorProgressJsonl | quote }}
              env:
                {{- if $kerberosEnabled }}
                - name: KRB5CCNAME
                  value: {{ printf "FILE:%s" $kerberosCachePath | quote }}
                {{- if $kerberosKrb5ConfKey }}
                - name: KRB5_CONFIG
                  value: {{ printf "/etc/query-doctor-kerberos-config/%s" $kerberosKrb5ConfKey | quote }}
                {{- end }}
                {{- end }}
                - name: {{ $recentHistoryPostgresDsnEnvName | quote }}
                  valueFrom:
                    secretKeyRef:
                      name: {{ $recentHistoryPostgresSecret | quote }}
                      key: {{ $recentHistoryPostgresDsnKey | quote }}
              {{- if .Values.credentials.existingSecret }}
              envFrom:
                - secretRef:
                    name: {{ .Values.credentials.existingSecret | quote }}
              {{- end }}
              resources:
                {{- toYaml .Values.recentSummaryCollector.resources | nindent 16 }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
                - name: config
                  mountPath: {{ .Values.config.mountPath | quote }}
                  readOnly: true
                - name: cases
                  mountPath: {{ .Values.persistence.mountPath | quote }}
                {{- if $kerberosEnabled }}
                - name: kerberos-cache
                  mountPath: /tmp/query-doctor-krb5
                {{- if $kerberosKrb5ConfKey }}
                - name: kerberos-config
                  mountPath: /etc/query-doctor-kerberos-config
                  readOnly: true
                {{- end }}
                {{- end }}
          volumes:
            - name: tmp
              emptyDir: {}
            - name: config
              configMap:
                name: {{ include "query-doctor.configMapName" . | quote }}
            - name: cases
              persistentVolumeClaim:
                claimName: {{ include "query-doctor.claimName" . | quote }}
            {{- if $kerberosEnabled }}
            - name: kerberos-cache
              emptyDir: {}
            - name: kerberos-init-secret
              secret:
                secretName: {{ $kerberosSecret | quote }}
                defaultMode: 0440
                items:
                  - key: {{ $kerberosPrincipalKey | quote }}
                    path: {{ $kerberosPrincipalKey | quote }}
                  - key: {{ $kerberosKeytabKey | quote }}
                    path: {{ $kerberosKeytabKey | quote }}
                  {{- if $kerberosKrb5ConfKey }}
                  - key: {{ $kerberosKrb5ConfKey | quote }}
                    path: {{ $kerberosKrb5ConfKey | quote }}
                  {{- end }}
            {{- if $kerberosKrb5ConfKey }}
            - name: kerberos-config
              secret:
                secretName: {{ $kerberosSecret | quote }}
                defaultMode: 0440
                items:
                  - key: {{ $kerberosKrb5ConfKey | quote }}
                    path: {{ $kerberosKrb5ConfKey | quote }}
            {{- end }}
            {{- end }}
{{- end }}
