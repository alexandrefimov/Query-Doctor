apiVersion: v1
kind: Namespace
metadata:
  name: query-doctor
  labels:
    app.kubernetes.io/name: query-doctor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: query-doctor-self-test
  namespace: query-doctor
  labels:
    app.kubernetes.io/name: query-doctor
    app.kubernetes.io/component: self-test
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: query-doctor-self-test
  namespace: query-doctor
  labels:
    app.kubernetes.io/name: query-doctor
    app.kubernetes.io/component: self-test
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: query-doctor
        app.kubernetes.io/component: self-test
    spec:
      serviceAccountName: query-doctor-self-test
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: self-test
          image: ghcr.io/alexandrefimov/query-doctor:0.11.0
          imagePullPolicy: IfNotPresent
          command:
            - query-doctor-self-test
          args:
            - --json
            - --timeout-sec
            - "120"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: query-doctor-self-test-no-egress
  namespace: query-doctor
  labels:
    app.kubernetes.io/name: query-doctor
    app.kubernetes.io/component: self-test
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: query-doctor
      app.kubernetes.io/component: self-test
  policyTypes:
    - Egress
  egress: []
