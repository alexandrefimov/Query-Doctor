apiVersion: v1
kind: Namespace
metadata:
  name: query-doctor
  labels:
    app.kubernetes.io/name: query-doctor
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: query-doctor-web
  namespace: query-doctor
  labels:
    app.kubernetes.io/name: query-doctor
    app.kubernetes.io/component: web
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-doctor-web
  namespace: query-doctor
  labels:
    app.kubernetes.io/name: query-doctor
    app.kubernetes.io/component: web
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: query-doctor
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: query-doctor
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: query-doctor-web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/alexandrefimov/query-doctor:0.11.0
          imagePullPolicy: IfNotPresent
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8765"
            - --allow-nonlocal-web-bind
            - --public-demo
          ports:
            - name: http
              containerPort: 8765
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: query-doctor-web
  namespace: query-doctor
  labels:
    app.kubernetes.io/name: query-doctor
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: query-doctor
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: query-doctor-public-demo-no-egress
  namespace: query-doctor
  labels:
    app.kubernetes.io/name: query-doctor
    app.kubernetes.io/component: web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: query-doctor
      app.kubernetes.io/component: web
  policyTypes:
    - Egress
  egress: []
