name: CodeQL

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "37 3 * * 2"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  readiness:
    name: CodeQL readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report CodeQL enablement gate
        run: |
          if [ "${{ vars.ENABLE_CODEQL }}" = "true" ]; then
            echo "CodeQL analysis is enabled for this repository."
          else
            echo "CodeQL workflow is installed but analysis is gated."
            echo "Enable code scanning in repository settings, then set repository variable ENABLE_CODEQL=true."
          fi

  analyze:
    name: CodeQL / Python
    if: vars.ENABLE_CODEQL == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
