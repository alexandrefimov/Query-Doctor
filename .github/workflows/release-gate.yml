name: Release Gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gate:
    name: Release gate / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Check committed whitespace
        run: git diff --check

      - name: Install local package, dev tools, and package tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build twine

      - name: Run ruff correctness checks
        run: python -m ruff check query_doctor tests scripts

      - name: Run full pytest suite
        run: python -m pytest -q

      - name: Run public-release preflight
        run: query-doctor-demo-preflight --public-release

      - name: Audit public docs for local-only notes
        run: python scripts/audit_public_docs.py

      - name: Generate synthetic demo pack
        run: |
          query-doctor-demo --out /tmp/query-doctor-release-demo --overwrite
          test -f /tmp/query-doctor-release-demo/batch_summary.json

      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py

      - name: Check active docs
        run: python scripts/check_active_docs.py

      - name: Build source and wheel distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install wheel in a clean virtualenv
        run: |
          python -m venv /tmp/query-doctor-release-wheel-venv
          /tmp/query-doctor-release-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/query-doctor-release-wheel-venv/bin/python -m pip install dist/*.whl
          /tmp/query-doctor-release-wheel-venv/bin/query-doctor-demo --out /tmp/query-doctor-release-wheel-demo --overwrite
          test -f /tmp/query-doctor-release-wheel-demo/batch_summary.json
          /tmp/query-doctor-release-wheel-venv/bin/query-doctor-demo-preflight --help
          /tmp/query-doctor-release-wheel-venv/bin/query-doctor-web --help
          /tmp/query-doctor-release-wheel-venv/bin/query-doctor-report --help
          /tmp/query-doctor-release-wheel-venv/bin/query-doctor-optimize-query --help

      - name: Smoke README Quickstart from installed wheel
        run: python scripts/installed_readme_quickstart_smoke.py --bin-dir /tmp/query-doctor-release-wheel-venv/bin

      - name: Smoke installed user paths
        run: python scripts/installed_user_paths_smoke.py --bin-dir /tmp/query-doctor-release-wheel-venv/bin
