name: Package CI

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Build, check, and install wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install package build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest twine

      - name: Check package metadata contract
        run: python -m pytest -q tests/test_pyproject.py

      - name: Build source and wheel distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install wheel in a clean virtualenv
        run: |
          python -m venv /tmp/query-doctor-wheel-venv
          /tmp/query-doctor-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/query-doctor-wheel-venv/bin/python -m pip install dist/*.whl

      - name: Smoke installed console scripts
        run: |
          /tmp/query-doctor-wheel-venv/bin/query-doctor-demo --out /tmp/query-doctor-package-demo --overwrite
          test -f /tmp/query-doctor-package-demo/batch_summary.json
          /tmp/query-doctor-wheel-venv/bin/query-doctor-demo-preflight --help
          /tmp/query-doctor-wheel-venv/bin/query-doctor-demo-preflight --repo "$GITHUB_WORKSPACE"
          /tmp/query-doctor-wheel-venv/bin/query-doctor-web --help
          /tmp/query-doctor-wheel-venv/bin/query-doctor-report --help
          /tmp/query-doctor-wheel-venv/bin/query-doctor-optimize-query --help

      - name: Smoke installed demo web UI
        run: |
          /tmp/query-doctor-wheel-venv/bin/query-doctor-web --host 127.0.0.1 --port 8767 --batch-summary /tmp/query-doctor-package-demo/batch_summary.json &
          web_pid="$!"
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT
          python - <<'PY'
          import http.client
          import time

          deadline = time.time() + 10
          while time.time() < deadline:
              try:
                  conn = http.client.HTTPConnection("127.0.0.1", 8767, timeout=1)
                  conn.request("GET", "/")
                  response = conn.getresponse()
                  response.read()
                  conn.close()
                  if response.status == 200:
                      raise SystemExit(0)
              except OSError:
                  time.sleep(0.2)
          raise SystemExit("installed web server did not become ready")
          PY
          python scripts/web_static_smoke.py \
            --url http://127.0.0.1:8767 \
            --expect-text "Finished Queries" \
            --expect-text "demo-optimizer-0001" \
            --expect-text "demo-validator-0003" \
            --expect-path-text "/?query_group=stats::demo-stats-0002"

      - name: Run installed console script contract tests
        run: |
          QUERY_DOCTOR_INSTALLED_CLI_BIN=/tmp/query-doctor-wheel-venv/bin python -m pytest -q tests/test_installed_cli_contract.py

      - name: Smoke README Quickstart from installed wheel
        run: python scripts/installed_readme_quickstart_smoke.py --bin-dir /tmp/query-doctor-wheel-venv/bin

      - name: Smoke installed user paths
        run: python scripts/installed_user_paths_smoke.py --bin-dir /tmp/query-doctor-wheel-venv/bin

      - name: Check declared console scripts are installed
        run: |
          /tmp/query-doctor-wheel-venv/bin/python - <<'PY'
          import sys
          from pathlib import Path

          scripts = []
          in_scripts = False
          for line in Path("pyproject.toml").read_text(encoding="utf-8").splitlines():
              stripped = line.strip()
              if stripped == "[project.scripts]":
                  in_scripts = True
                  continue
              if in_scripts and stripped.startswith("["):
                  break
              if in_scripts and stripped and not stripped.startswith("#") and "=" in stripped:
                  scripts.append(stripped.split("=", 1)[0].strip())

          script_dir = Path(sys.executable).parent
          missing = sorted(name for name in scripts if not (script_dir / name).exists())
          if missing:
              for name in missing:
                  print(f"missing console script: {name}", file=sys.stderr)
              raise SystemExit(1)
          PY
