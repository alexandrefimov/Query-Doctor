name: Publish Package

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  pypi:
    name: Publish to PyPI
    if: startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate release tag matches package version
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as project_file:
              version = tomllib.load(project_file)["project"]["version"]

          tag = os.environ["GITHUB_REF_NAME"]
          expected = f"v{version}"
          if tag != expected:
              raise SystemExit(f"release tag {tag!r} does not match package version {expected!r}")
          PY

      - name: Install package build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest twine

      - name: Check package metadata contract
        run: python -m pytest -q tests/test_pyproject.py

      - name: Build source and wheel distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install wheel in a clean virtualenv
        run: |
          python -m venv /tmp/query-doctor-publish-wheel-venv
          /tmp/query-doctor-publish-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/query-doctor-publish-wheel-venv/bin/python -m pip install dist/*.whl
          /tmp/query-doctor-publish-wheel-venv/bin/query-doctor-demo --out /tmp/query-doctor-publish-demo --overwrite
          test -f /tmp/query-doctor-publish-demo/batch_summary.json
          /tmp/query-doctor-publish-wheel-venv/bin/query-doctor-demo-preflight --help
          /tmp/query-doctor-publish-wheel-venv/bin/query-doctor-web --help
          /tmp/query-doctor-publish-wheel-venv/bin/query-doctor-report --help
          /tmp/query-doctor-publish-wheel-venv/bin/query-doctor-optimize-query --help

      - name: Run installed console script contract tests
        run: |
          QUERY_DOCTOR_INSTALLED_CLI_BIN=/tmp/query-doctor-publish-wheel-venv/bin python -m pytest -q tests/test_installed_cli_contract.py

      - name: Smoke installed user paths
        run: python scripts/installed_user_paths_smoke.py --bin-dir /tmp/query-doctor-publish-wheel-venv/bin

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
