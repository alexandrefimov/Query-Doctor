name: Publish TestPyPI Package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testpypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Require main branch
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "TestPyPI publishing must run from main, got $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install package build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build pytest twine

      - name: Check package metadata contract
        run: python -m pytest -q tests/test_pyproject.py

      - name: Build source and wheel distributions
        run: python -m build

      - name: Check distribution metadata
        run: python -m twine check dist/*

      - name: Install wheel in a clean virtualenv
        run: |
          python -m venv /tmp/query-doctor-testpypi-wheel-venv
          /tmp/query-doctor-testpypi-wheel-venv/bin/python -m pip install --upgrade pip
          /tmp/query-doctor-testpypi-wheel-venv/bin/python -m pip install dist/*.whl
          /tmp/query-doctor-testpypi-wheel-venv/bin/query-doctor-demo --out /tmp/query-doctor-testpypi-demo --overwrite
          test -f /tmp/query-doctor-testpypi-demo/batch_summary.json
          /tmp/query-doctor-testpypi-wheel-venv/bin/query-doctor-demo-preflight --help
          /tmp/query-doctor-testpypi-wheel-venv/bin/query-doctor-web --help
          /tmp/query-doctor-testpypi-wheel-venv/bin/query-doctor-report --help
          /tmp/query-doctor-testpypi-wheel-venv/bin/query-doctor-optimize-query --help

      - name: Run installed console script contract tests
        run: |
          QUERY_DOCTOR_INSTALLED_CLI_BIN=/tmp/query-doctor-testpypi-wheel-venv/bin python -m pytest -q tests/test_installed_cli_contract.py

      - name: Smoke README Quickstart from installed wheel
        run: python scripts/installed_readme_quickstart_smoke.py --bin-dir /tmp/query-doctor-testpypi-wheel-venv/bin

      - name: Smoke installed user paths
        run: python scripts/installed_user_paths_smoke.py --bin-dir /tmp/query-doctor-testpypi-wheel-venv/bin

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
