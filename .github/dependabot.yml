version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - tooling
    ignore:
      # These pins belong to the isolated CDH6-compatible impala-shell venv.
      # scripts/bootstrap-impala-shell installs impala_shell itself with
      # --no-deps so patched transitive dependencies such as sqlparse can move
      # independently from the legacy shell package.
      - dependency-name: "bitarray"
      - dependency-name: "configparser"
      - dependency-name: "prettytable"
      - dependency-name: "six"
      - dependency-name: "thrift"
      # requires-python is ">=3.9" and CI runs a 3.9 job. These releases need
      # 3.10, so the bumps cannot be taken until the floor moves. Drop these
      # entries in the same change that raises requires-python.
      - dependency-name: "setuptools"
        versions: [">=83"]
      - dependency-name: "pre-commit"
        versions: [">=4.4"]
      - dependency-name: "pytest"
        versions: [">=9"]
      # Same 3.10 floor, but no CI job installs the postgres extra, so a bump
      # here goes green and only shows up as `pip install query-doctor[postgres]`
      # failing to resolve on 3.9. Drop with the entries above.
      - dependency-name: "psycopg"
        versions: [">=3.3"]
