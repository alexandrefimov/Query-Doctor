version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:30"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - tooling
    ignore:
      # These pins belong to the isolated CDH6-compatible impala-shell venv.
      # impala-shell==4.3.0 declares exact requirements for them, so moving
      # any one of these versions breaks scripts/bootstrap-impala-shell.
      # Revisit only together with an impala-shell compatibility update.
      - dependency-name: "bitarray"
      - dependency-name: "configparser"
      - dependency-name: "prettytable"
      - dependency-name: "six"
      - dependency-name: "sqlparse"
      - dependency-name: "thrift"
