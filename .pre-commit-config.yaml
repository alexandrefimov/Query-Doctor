repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format-check
        name: ruff format check
        entry: ruff format --check
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: staged-whitespace-check
        name: staged whitespace check
        entry: git diff --check --cached
        language: system
        pass_filenames: false

      - id: markdown-link-check
        name: markdown link check
        entry: python scripts/check_markdown_links.py
        language: system
        pass_filenames: false
