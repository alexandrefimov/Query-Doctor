[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "query-doctor"
version = "0.1.2"
description = "Local-first Big Data query diagnostics for Apache Impala."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.9"
authors = [
    { name = "Aleksandr Efimov" },
]
maintainers = [
    { name = "Aleksandr Efimov" },
]
keywords = [
    "apache-impala",
    "big-data",
    "cloudera-manager",
    "diagnostics",
    "lakehouse",
    "query-analysis",
    "sql",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Database",
    "Topic :: System :: Monitoring",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.5",
    "pytest>=8",
    "ruff>=0.8",
]
e2e = [
    "playwright>=1.48",
]

[project.scripts]
query-doctor-analyze = "query_doctor.cli.analyze_profile:main"
query-doctor-batch-recent = "query_doctor.cli.batch_recent:main"
query-doctor-cleanup-generated = "query_doctor.cli.cleanup_generated:main"
query-doctor-cm-events = "query_doctor.cli.cm_events:main"
query-doctor-cm-sample-smoke = "query_doctor.cli.cm_sample_smoke:main"
query-doctor-collect-cm-profiles = "query_doctor.cli.collect_cm_profiles:main"
query-doctor-collect-impala-context = "query_doctor.cli.collect_impala_context:main"
query-doctor-collect-impala-profile = "query_doctor.cli.collect_impala_profile:main"
query-doctor-corpus-smoke = "query_doctor.cli.corpus_smoke:main"
query-doctor-demo = "query_doctor.cli.demo_data:main"
query-doctor-demo-preflight = "query_doctor.cli.demo_preflight:main"
query-doctor-optimize-query = "query_doctor.cli.optimize_query:main"
query-doctor-pipeline = "query_doctor.cli.pipeline:main"
query-doctor-report = "query_doctor.cli.report:main"
query-doctor-web = "query_doctor.cli.web:main"

[project.urls]
Homepage = "https://github.com/alexandrefimov/Query-Doctor"
Repository = "https://github.com/alexandrefimov/Query-Doctor"
Issues = "https://github.com/alexandrefimov/Query-Doctor/issues"
Documentation = "https://github.com/alexandrefimov/Query-Doctor/blob/main/docs/README.md"

[tool.setuptools.packages.find]
include = ["query_doctor*"]

[tool.setuptools.package-data]
"query_doctor.web.static" = ["*.css", "*.js"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
    "cases",
    "legacy",
]

[tool.ruff.lint]
# Start with correctness checks that should be safe for the existing tree.
# Broaden this set only after fixing or intentionally ignoring current findings.
select = ["E9", "F63", "F7", "F82"]
